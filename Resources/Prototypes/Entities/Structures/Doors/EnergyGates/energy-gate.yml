- type: entity
  parent: BaseStructure
  abstract: true
  id: BaseTurnstile
  components:
  - type: AnimationPlayer
  - type: InteractionOutline
  - type: DirectionalArrowIndicator
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/smash.ogg"
  - type: AccessReader
    containerAccessProvider: board
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: ContainerFill
    containers:
      board: [ DoorElectronics ]
  - type: Turnstile
    processWhitelist:
      components:
      - MobState # no mobs
      - Pullable # no dragging things in
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # same dimensions as a door for tall turnstile, prevents objects being thrown through
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.50,-0.50,0.50,0.50" # same dimensions as a door for tall turnstile, prevents objects being thrown through
        hard: false
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer

- type: entity
  parent: [ BaseTurnstile, StructureHealthDoorWeak]
  id: MetalTurnstile
  name: metal turnstile
  description: A simple turnstile that only permits one-way access and prevents tailgating, despite being easily bypassed by most people.
  components:
  - type: Sprite
    sprite: Structures/Doors/Misc/energy-gate.rsi
    drawdepth: Objects
    layers:
    - state: security
    - state: idle-security
      shader: unshaded
      map: [ "barrier" ]
    - state: direction
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TurnstileVisualLayers.Base:
        barrier:
          Idle: { state: idle-security }
          Spin: { state: operate }
          Deny: { state: deny }
  - type: Fixtures #Redefined soley to lower mask and layer height.
    fixtures:
      fix1:
        mask:
        - MachineMask
        layer:
        - MachineLayer
      fix2:
        hard: false
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3
          PartRodMetal1:
            min: 2
            max: 5
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Construction
    graph: MetalTurnstile
    node: metalTurnstile
  - type: Climbable
    delay: 0.5 # Insert Gif of people vaulting subway turnstiles
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4

# Powered Variant
- type: entity
  parent: [ BaseTurnstile, StructureHealthDoor]
  id: EnergyGate
  name: energy gate
  description: An advanced gate that permits one-way access and prevents tailgating.
  components:
  - type: Sprite
    sprite: Structures/Doors/Misc/energy-gate.rsi
    drawdepth: Doors
    layers:
    - state: regular
    - state: idle
      shader: unshaded
      map: [ "barrier", "enum.PowerDeviceVisualLayers.Powered" ]
    - state: direction
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TurnstileVisualLayers.Base:
        barrier:
          Idle: { state: idle }
          Spin: { state: operate }
          Deny: { state: deny }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ExaminableBattery
  - type: ApcPowerReceiver
    powerLoad: 60 # x3 rate of a door, because it is literally made of energy
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: Battery
    # Very important:
    # Disable networking to prevent the battery getting continuously dirtied every tick as it interacts with the power network.
    # This can not be done by changing the charge rate as the power supply ramps up over time.
    # This disables prediction for this battery.
    netsync: false
    maxCharge: 6240 # 104 seconds to fully drain, longer than the longest possible blackout.
    startingCharge: 3120 # Starts 50% full, meaning its more power hungry at shift start.
  - type: ApcPowerReceiverBattery
    idleLoad: 60
    batteryRechargeRate: 240
    batteryRechargeEfficiency: 0.0 # temporarily no power draw because this was causing potentially seizure inducing light flickering
  - type: Turnstile
    turnSound:
      path: /Audio/Effects/gateway_off.ogg
      params:
        variation: 0.02
        volume: -9
  - type: Damageable
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
          - board
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 6
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Construction
    graph: EnergyGate
    node: energyGate
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: PlacementReplacement
    key: walls
  - type: LitOnPowered
  - type: PointLight
    energy: 2.2
    color: "#cc3a41"
    radius: 2.2


# Airtight
- type: entity
  parent: EnergyGate
  id: EnergyGateAirtight
  name: arrivals energy gate
  description: A specalized gate that permits one-way access and prevents tailgating. It's airtight and doesn't require power.
  suffix: Airtight
  components:
  - type: Airtight
  - type: RadiationBlocker
    resistance: 4
  - type: ApcPowerReceiver
    needsPower: false # Required for multiple reasons, no arrivals shuttle, no easy exit from the station.
  - type: Sprite
    layers:
    - state: airtight
    - state: idle
      shader: unshaded
      map: [ "barrier" ]
    - state: direction-airtight
      shader: unshaded
  - type: PointLight
    energy: 2.2
    color: "#50abff"
    radius: 2.2

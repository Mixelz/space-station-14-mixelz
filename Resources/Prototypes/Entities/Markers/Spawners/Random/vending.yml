- type: entity
  parent: MarkerBase
  id: RandomVending
  name: random vending machine spawner
  suffix: Any
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Machines/VendingMachines/random.rsi
      state: any
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - !type:NestedSelector
        tableId: ClothingVendorTable
        weight: 0.5 # Still majority drinks/snacks/other, don't want to flood with clothe vends.
      - !type:NestedSelector
        tableId: SnackVendorTable
      - !type:NestedSelector
        tableId: DrinkVendorTable
      - !type:NestedSelector
        tableId: MiscVendorTable
        weight: 0.25 # Lower Weight until the table is filled more (it's basically only cig vend)

- type: entity
  parent: MarkerBase
  id: RandomVendingOther
  name: random vending machine spawner
  suffix: Misc
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Machines/VendingMachines/random.rsi
      state: other
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MiscVendorTable

- type: entityTable
  id: MiscVendorTable #Future Proofing for non-food/drink/clothing vends.
  table: !type:GroupSelector
    children:
    - id: VendingMachineCigs
    - id: VendingMachineVendomat
      weight: 0.1
    - id: VendingMachineYouTool
      weight: 0.1

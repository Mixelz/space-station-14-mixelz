- type: constructionGraph
  id: MetalTurnstile
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity { }
    edges:
    - to: metalTurnstile
      completed:
      - !type:SnapToGrid
      steps:
      - material: MetalRod
        amount: 6
      - material: Steel
        amount: 2
        doAfter: 8

  - node: metalTurnstile
    entity: MetalTurnstile
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 4
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 4.0
      - tool: Cutting
        doAfter: 2.0

